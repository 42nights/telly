# Structural rules for the health app. `bun run check:structure` (scripts/check-structure.sh) runs
# `sentrux check` and `sentrux gate` against the committed baseline (.sentrux/baseline.json) on the
# app only, without noop/. Move the baseline only in a reviewed commit (`--save`), never to make a
# red check pass.
[constraints]
max_cycles = 0
no_god_files = true

[[boundaries]]
from = "apps/web/**"
to = "packages/db/**"
reason = "Clients never import database code"

[[boundaries]]
from = "apps/native/**"
to = "packages/db/**"
reason = "Clients never import database code"

[[boundaries]]
from = "packages/contracts/**"
to = "apps/**"
reason = "Contracts import no application code"
