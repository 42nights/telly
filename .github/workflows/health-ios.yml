name: health iOS build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/native/**"
      - ".github/workflows/health-ios.yml"

jobs:
  # Xcode needs macOS. The job runs only when the repository variable HEALTH_IOS_RUNNER names a
  # macOS runner (`macos-26`, or a self-hosted Mac's label); otherwise it is skipped. HEALTH_RUNNER
  # is a Linux runner, so it is not used here. This check is not part of the `required` gate.
  # HEALTH_IOS_RUNNER is `telly-mac`: one self-hosted runner on the captain's MacBook, installed in
  # ~/actions-runner-telly as a launchd user service. It needs Xcode 26 with the iOS platform
  # (`xcodebuild -downloadPlatform iOS`) and CocoaPods on the runner's PATH (its .path file).
  # Jobs wait in the queue while the laptop sleeps.
  ios:
    if: vars.HEALTH_IOS_RUNNER != ''
    runs-on: ${{ vars.HEALTH_IOS_RUNNER }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The app's server and web app default to production (apps/native/.env.schema). Sign-in uses
      # the public Google settings of the deployment.
      - name: Use the production sign-in settings
        run: |
          . deploy/cloudflare/settings.env
          echo "EXPO_PUBLIC_OIDC_ISSUER=$OIDC_ISSUER" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_OIDC_CLIENT_ID=$OIDC_AUDIENCE" >> "$GITHUB_ENV"
      - working-directory: apps/native
        run: bunx expo prebuild --platform ios
      - working-directory: apps/native/ios
        run: >-
          xcodebuild -workspace health.xcworkspace -scheme health -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - working-directory: apps/native/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr health-ios.ipa Payload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-ios
          path: apps/native/ios/health-ios.ipa
