name: health iOS build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/native/**"
      - ".github/workflows/health-ios.yml"

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - working-directory: apps/native
        run: bunx expo prebuild --platform ios
      - working-directory: apps/native/ios
        run: >-
          xcodebuild -workspace health.xcworkspace -scheme health -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - working-directory: apps/native/ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr health-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: health-ios
          path: apps/native/ios/health-ios.ipa
