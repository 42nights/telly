# Checks for the health application at the repository root (apps/, packages/, agents/, root manifests).
# NOOP's own workflows are separate and cover noop/.
#
# Every job runs on every PR so that `health / required` always reports: it passes when the app is
# untouched (all checks skipped on purpose), and otherwise only when every check succeeded. Make
# `health / required` the one required status check; never require the individual jobs.
#
# `check` and `structure` run on the runner named by the repository variable HEALTH_RUNNER (a
# Namespace label, see README.md) and on ubuntu-latest when it is unset. `changes` and
# `required` always use ubuntu-latest, so the gate reports even when no Namespace runner is available.
#
# `pull_request` has no branch filter so a `gh stack` PR, whose base is the PR below it, is checked
# too. On pull_request, paths-filter lists the PR's files from the API, so the diff is against the
# PR's own base. `github.ref` is `refs/pull/<n>/merge`, so one PR never cancels a sibling's run.
name: health

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SENTRUX_VERSION: v0.5.7
  SENTRUX_SHA256: 3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6
  SPACETIME_VERSION: v2.10.2
  SPACETIME_SHA256: 5dbe3f27a8c9e27a1d9aa86e9101f0eb6f5cf5aebea0240b589750e424a695bd

jobs:
  changes:
    runs-on: ${{ vars.HEALTH_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      health: ${{ steps.filter.outputs.health }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            health:
              - 'apps/**'
              - 'packages/**'
              - 'agents/**'
              - 'spacetimedb/**'
              - 'patches/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'biome.json'
              - 'bts.jsonc'
              - '.fallowrc.json'
              - '.sentrux/**'
              - 'scripts/**'
              - '.gitignore'
              - '.github/workflows/health.yml'

  check:
    needs: changes
    if: needs.changes.outputs.health == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.HEALTH_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: bun run lint
          - name: types
            run: bun run check-types
          - name: test
            run: bun run test
          - name: quality
            run: bun run check:quality
          - name: build-smoke
            run: bun run --filter server build && bun run smoke && bun run --filter web build
          # Headless Chromium against the built web app with a faked server and sign-in.
          - name: web-smoke
            run: >-
              (cd apps/web && bunx playwright install --with-deps chromium) &&
              bun run --filter web smoke
          # Fails when packages/db is stale against spacetimedb/, then `bun run coverage`: the unit
          # tests, then the family-access, connection-recovery, server-lifecycle (the built server
          # under Node), and integration tests (real sign-in and user paths, fake providers) against
          # an isolated in-memory local database, then per-package coverage of both. Last, the
          # crash-restart and backup/restore drill. db:test runs its files at the same time, one
          # database each; see scripts/db-test.sh.
          - name: db
            run: >-
              bun run db:generate &&
              git diff --exit-code -- packages/db &&
              test -z "$(git status --porcelain -- packages/db)" &&
              bun run coverage &&
              bun run db:drill
          # Fails when agents/fetch/contract.json is stale against the shared schemas, then runs the
          # Python worker's tests with its pinned requirements.
          - name: fetch-agent
            run: >-
              bun run --filter @health/contracts agent-contract &&
              git diff --exit-code -- agents/fetch/contract.json &&
              python -m venv agents/fetch/.venv &&
              agents/fetch/.venv/bin/pip install -r agents/fetch/requirements.txt &&
              cd agents/fetch && .venv/bin/python -m unittest -v
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A persistent self-hosted runner (telly-local) already has the pinned Bun on PATH and keeps
      # ~/.bun/install/cache and its tool cache between jobs, so the Bun download and the cache
      # restore run only when the runner lacks them (GitHub-hosted and Namespace runners).
      - name: Find tools already on the runner
        id: host
        run: |
          bun=$(sed -n 's/.*"packageManager": "bun@\([^"]*\)".*/\1/p' package.json)
          [ "$(bun --version 2>/dev/null)" = "$bun" ] && echo bun=true >> "$GITHUB_OUTPUT"
          [ -d ~/.bun/install/cache ] && echo bun-cache=true >> "$GITHUB_OUTPUT"
          true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.host.outputs.bun != 'true'
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.name == 'build-smoke' || matrix.name == 'db'
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.name == 'fetch-agent'
        with:
          python-version: "3.12"
      - name: Install SpacetimeDB CLI (checksum-verified)
        if: matrix.name == 'db'
        run: |
          dir="$RUNNER_TOOL_CACHE/spacetime/$SPACETIME_VERSION"
          if [ ! -x "$dir/spacetime" ]; then
            curl -fsSL -o "$RUNNER_TEMP/spacetime.tar.gz" \
              "https://github.com/clockworklabs/SpacetimeDB/releases/download/$SPACETIME_VERSION/spacetime-x86_64-unknown-linux-gnu.tar.gz"
            echo "$SPACETIME_SHA256  $RUNNER_TEMP/spacetime.tar.gz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/spacetime" "$(dirname "$dir")"
            tar -xzf "$RUNNER_TEMP/spacetime.tar.gz" -C "$RUNNER_TEMP/spacetime"
            ln -s spacetimedb-cli "$RUNNER_TEMP/spacetime/spacetime"
            mv "$RUNNER_TEMP/spacetime" "$dir"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.host.outputs.bun-cache != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: ${{ matrix.run }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.name == 'db'
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
      # Report-only for now: remove continue-on-error to make 95% per package a required gate.
      - name: Coverage gate (95% lines and functions per package, report-only)
        if: matrix.name == 'db'
        continue-on-error: true
        run: bun scripts/coverage-summary.ts --min 95 coverage/unit/lcov.info coverage/db/lcov.info

  structure:
    needs: changes
    if: needs.changes.outputs.health == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.HEALTH_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sentrux
          key: sentrux-${{ runner.os }}-${{ env.SENTRUX_VERSION }}
      - name: Install Sentrux (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sentrux" \
            "https://github.com/sentrux/sentrux/releases/download/$SENTRUX_VERSION/sentrux-linux-x86_64"
          echo "$SENTRUX_SHA256  $RUNNER_TEMP/sentrux" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sentrux"
          if ldd "$RUNNER_TEMP/sentrux" | grep -q 'not found'; then
            sudo apt-get update -q && sudo apt-get install -yq libgtk-3-0t64
          fi
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: sentrux analytics off
      # Rules (no cycles, no god files, client and contract boundaries in .sentrux/rules.toml) and
      # the regression gate against .sentrux/baseline.json, on the app only: the script leaves out
      # noop/. Move the baseline only in a reviewed commit; see CONTRIBUTING.md.
      - run: sh scripts/check-structure.sh

  required:
    name: required
    needs: [changes, check, structure]
    if: always()
    runs-on: ${{ vars.HEALTH_RUNNER || 'ubuntu-latest' }}
    steps:
      - env:
          CHANGED: ${{ needs.changes.outputs.health == 'true' || github.event_name == 'workflow_dispatch' }}
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          STRUCTURE: ${{ needs.structure.result }}
        run: |
          echo "changed=$CHANGED changes=$CHANGES check=$CHECK structure=$STRUCTURE"
          [ "$CHANGES" = success ] || { echo "::error::change detection did not succeed"; exit 1; }
          if [ "$CHANGED" = true ]; then
            [ "$CHECK" = success ] && [ "$STRUCTURE" = success ] && exit 0
            echo "::error::a health check failed, was cancelled, or was skipped"; exit 1
          fi
          [ "$CHECK" = skipped ] && [ "$STRUCTURE" = skipped ] && exit 0
          echo "::error::checks ran although the health app did not change"; exit 1
