name: telly iOS build

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: noop
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >-
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          rm -rf "$APP/Watch"
          Tools/prepare-ios-sideload-app.sh "$APP"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr telly-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: telly-ios
          path: noop/telly-ios.ipa
