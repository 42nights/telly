# Telly AR pin simulation (tools/ar-sim): save -> relocalize -> project over seeded, randomized trials.
# Two quick jobs run in parallel, each under 3 minutes. `sim`: 24 single-object trials; it fails when
# the baseline misses the bar (pairing >= 95 percent, marker >= 90 percent, p95 <= 5 cm and <= 20 px,
# arrow p95 <= 15 degrees). `multi`: 4 rooms with 20 pinned containers on a map without VIO drift
# (0 wrong markers, p95 <= 5 cm; the drift runs are in docs/ar-sim/README.md) and the usual-place
# learner. Seeds are fixed, so a red run is a regression, not chance. Both run on the HEALTH_RUNNER (see
# health.yml) like the app checks. Procedures: docs/ar-sim/procedures.md.
name: ar-sim

on:
  pull_request:
    paths:
      - 'tools/ar-sim/**'
      - '.github/workflows/ar-sim.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ar-sim/**'
      - '.github/workflows/ar-sim.yml'
  workflow_dispatch:

concurrency:
  group: ar-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sim:
    runs-on: ${{ vars.HEALTH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ar-sim/requirements.txt
      - run: pip install -r tools/ar-sim/requirements.txt
      - run: python tools/ar-sim/run.py --quick --out "$RUNNER_TEMP/ar-sim"
      - if: always()
        run: cat "$RUNNER_TEMP/ar-sim/results.md" >> "$GITHUB_STEP_SUMMARY" || true

  multi:
    runs-on: ${{ vars.HEALTH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ar-sim/requirements.txt
      - run: pip install -r tools/ar-sim/requirements.txt
      - run: python tools/ar-sim/multi.py --quick --map-without-drift --out "$RUNNER_TEMP/ar-sim"
      - run: python tools/ar-sim/usual.py --out "$RUNNER_TEMP/ar-sim"
      - if: always()
        run: cat "$RUNNER_TEMP/ar-sim/multi-depth-no-drift.md" "$RUNNER_TEMP/ar-sim/usual.md" >> "$GITHUB_STEP_SUMMARY" || true
